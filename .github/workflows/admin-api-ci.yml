name: Admin API CI

# Single source of truth for the Admin API checks (the former build.yml has been merged into this
# file and ui-ci.yml, so spotless and the full verify with the coverage gate always run together).
on:
  push:
    branches: [ "main", "development/**", "feature/lts-*", "fix/main-review-findings" ]
    paths:
      - 'fluxgate-studio-admin-api/**'
      - '.github/workflows/admin-api-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main", "feature/lts-*" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: fluxgate-studio-admin-api

jobs:
  build:
    name: Admin API checks
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: fluxgate
          MONGO_INITDB_ROOT_PASSWORD: fluxgate123
          MONGO_INITDB_DATABASE: fluxgate
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username fluxgate --password fluxgate123 --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      FLUXGATE_MONGO_URI: "mongodb://fluxgate:fluxgate123@localhost:27017/fluxgate?authSource=admin"
      FLUXGATE_MONGO_DB: "fluxgate"

    steps:
      - uses: actions/checkout@v4

      # Keep this revision paired with docker-compose.yml and deploy/README.md.
      - name: Check out paired core policy source
        uses: actions/checkout@v4
        with:
          repository: OpenFluxGate/openfluxgate-core
          ref: 39a1789acfc481e416e7363dc6e9dd3817b147b5
          path: .paired-core

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install paired core artifacts into a clean repository
        working-directory: .paired-core
        run: >-
          ./mvnw -B -ntp
          -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2"
          -pl fluxgate-spring-boot3-starter,fluxgate-control-support -am
          -Dmaven.test.skip=true -Djacoco.skip=true -Dspotless.skip=true install

      - name: Check code style
        run: ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2" spotless:check

      - name: Build (skip tests first)
        run: ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2" compile -DskipTests

      - name: Run tests with coverage gate
        run: ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2" verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: 'fluxgate-studio-admin-api/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: 'fluxgate-studio-admin-api/target/surefire-reports/*.xml'

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: 'fluxgate-studio-admin-api/target/site/jacoco/'
