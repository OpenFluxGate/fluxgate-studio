name: Deploy Studio UI to AWS Lightsail

on:
  push:
    branches:
      - main
    paths:
      - 'fluxgate-studio-ui-nextjs/**'
      - '.github/workflows/deploy-studio-ui.yml'
      - 'deploy/candidate/**'

permissions:
  contents: read

# Do not cancel a deployment after it has stopped a service. Keep API/UI groups
# separate: a shared pending slot could discard the other component's deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fluxgate-studio-ui-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: fluxgate-studio-ui-nextjs
        run: npm ci

      - name: Validate UI before deployment
        working-directory: fluxgate-studio-ui-nextjs
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test

      - name: Build Next.js (standalone)
        working-directory: fluxgate-studio-ui-nextjs
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Prepare verified deployment bundle
        run: |
          set -euo pipefail
          mkdir .deployment
          test -s fluxgate-studio-ui-nextjs/.next/standalone/server.js
          test -s fluxgate-studio-ui-nextjs/.next/standalone/.next/BUILD_ID
          cp -a fluxgate-studio-ui-nextjs/.next/static fluxgate-studio-ui-nextjs/.next/standalone/.next/static
          if [ -d fluxgate-studio-ui-nextjs/public ]; then
            cp -a fluxgate-studio-ui-nextjs/public fluxgate-studio-ui-nextjs/.next/standalone/public
          fi
          tar -czf .deployment/ui.tar.gz -C fluxgate-studio-ui-nextjs .next/standalone
          cp deploy/candidate/activate-ui.sh .deployment/activate.sh
          (cd .deployment && sha256sum * > SHA256SUMS)

      - name: Require verified production activation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENABLED: ${{ vars.STUDIO_SAFE_DEPLOY_ENABLED }}
          RETENTION_REVIEWED: ${{ vars.STUDIO_AUDIT_RETENTION_REVIEWED }}
        run: |
          test "$RETENTION_REVIEWED" = true || { echo 'Production blocked: audit TTL may delete existing data. Resolve retention behavior and obtain required approval before enabling.' >&2; exit 1; }
          test "$ENABLED" = true || { echo 'Production activation blocked: validate server permissions, recovery and data compatibility before enabling STUDIO_SAFE_DEPLOY_ENABLED.' >&2; exit 1; }

      - name: Upload staging bundle without stopping service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: ".deployment/*"
          target: "/opt/fluxgate/studio/.deploy-staging/${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Activate staged release with server-owned lifetime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            root=/opt/fluxgate/studio
            stage="$root/.deploy-staging/${{ github.run_id }}-${{ github.run_attempt }}"
            test -d "$root"
            test -w "$root"
            test ! -e "$root/.activation-pending"
            command -v systemd-run >/dev/null
            command -v flock >/dev/null
            cd "$stage"
            sha256sum -c SHA256SUMS
            mkdir "$stage/unpacked"
            tar -xzf ui.tar.gz -C "$stage/unpacked"
            artifact="$stage/unpacked/.next"
            expected=unused
            # The transient system service outlives this SSH client. Never retry blindly
            # after transport failure: query its status and the pending marker first.
            sudo -n systemd-run --unit="fluxgate-deploy-ui-${{ github.run_id }}-${{ github.run_attempt }}" --uid="$(id -un)" --property=Type=exec --wait /bin/bash "$stage/activate.sh" "$root" "$artifact" "$expected"
