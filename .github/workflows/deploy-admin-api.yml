name: Deploy Admin API to AWS Lightsail

on:
  push:
    branches:
      - main
    paths:
      - 'fluxgate-studio-admin-api/**'
      - '.github/workflows/deploy-admin-api.yml'
      - 'deploy/candidate/**'
  pull_request:
    branches: [ "main", "feature/lts-*" ]
    paths:
      - 'fluxgate-studio-admin-api/**'
      - '.github/workflows/deploy-admin-api.yml'
      - 'deploy/candidate/**'

permissions:
  contents: read

# Do not cancel a deployment after it has stopped a service. Keep API/UI groups
# separate: a shared pending slot could discard the other component's deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Admin API deployment build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Keep this revision paired with admin-api-ci.yml and docker-compose.yml.
      - name: Check out paired core policy source
        uses: actions/checkout@v4
        with:
          repository: OpenFluxGate/openfluxgate-core
          ref: 39a1789acfc481e416e7363dc6e9dd3817b147b5
          path: .paired-core
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install paired core artifacts into a clean repository
        working-directory: .paired-core
        run: >-
          ./mvnw -B -ntp
          -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2"
          -pl fluxgate-spring-boot3-starter,fluxgate-control-support -am
          -Dmaven.test.skip=true -Djacoco.skip=true -Dspotless.skip=true install

      - name: Build with Maven
        working-directory: fluxgate-studio-admin-api
        run: ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/fluxgate-m2" clean verify

      - name: Prepare verified deployment bundle
        run: |
          set -euo pipefail
          mkdir .deployment
          test -s fluxgate-studio-admin-api/target/fluxgate-studio-admin-api-0.5.0.jar
          cp fluxgate-studio-admin-api/target/fluxgate-studio-admin-api-0.5.0.jar .deployment/api.jar
          cp deploy/candidate/activate-api.sh .deployment/activate.sh
          (cd .deployment && sha256sum * > SHA256SUMS)

      - name: Hold production activation pending operational review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo 'Production activation is disabled in code: reboot recovery and API/UI mixed-version compatibility are not verified. Repository variables cannot bypass this hold.' >&2
          exit 1

      - name: Require verified production activation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENABLED: ${{ vars.STUDIO_SAFE_DEPLOY_ENABLED }}
          RETENTION_REVIEWED: ${{ vars.STUDIO_AUDIT_RETENTION_REVIEWED }}
          HOST_FINGERPRINT: ${{ secrets.LIGHTSAIL_HOST_FINGERPRINT }}
        run: |
          [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || { echo 'Production blocked: independently verified SSH host fingerprint required.' >&2; exit 1; }
          test "$RETENTION_REVIEWED" = true || { echo 'Production blocked: audit TTL may delete existing data. Resolve retention behavior and obtain required approval before enabling.' >&2; exit 1; }
          test "$ENABLED" = true || { echo 'Production activation blocked: validate server permissions, recovery and data compatibility before enabling STUDIO_SAFE_DEPLOY_ENABLED.' >&2; exit 1; }

      - name: Upload staging bundle without stopping service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          fingerprint: ${{ secrets.LIGHTSAIL_HOST_FINGERPRINT }}
          source: ".deployment/*"
          target: "/opt/fluxgate/admin-api/.deploy-staging/${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Activate staged release with server-owned lifetime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          fingerprint: ${{ secrets.LIGHTSAIL_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -eu
            root=/opt/fluxgate/admin-api
            stage="$root/.deploy-staging/${{ github.run_id }}-${{ github.run_attempt }}"
            test -d "$root"
            test -w "$root"
            test ! -e "$root/.activation-pending"
            command -v systemd-run >/dev/null
            command -v flock >/dev/null
            cd "$stage"
            sha256sum -c SHA256SUMS
            expected=$(sha256sum api.jar | cut -d' ' -f1)
            artifact="$stage/api.jar"
            # The transient system service outlives this SSH client. Never retry blindly
            # after transport failure: query its status and the pending marker first.
            sudo -n systemd-run --unit="fluxgate-deploy-api-${{ github.run_id }}-${{ github.run_attempt }}" --uid="$(id -un)" --property=Type=exec --wait /bin/bash "$stage/activate.sh" "$root" "$artifact" "$expected"
