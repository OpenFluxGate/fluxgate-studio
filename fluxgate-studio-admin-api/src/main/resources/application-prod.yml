# Production profile example: activate with SPRING_PROFILES_ACTIVE=prod
#
# Everything here is an override of application.yml. Only the values that must differ in a
# production deployment are listed; nothing else changes, so the default (development) profile keeps
# behaving exactly as before.
#
# Required environment variables:
#   KEYCLOAK_ISSUER_URI      - realm issuer, e.g. https://sso.example.com/realms/fluxgate
#   KEYCLOAK_JWK_SET_URI     - realm JWKS endpoint
#   FLUXGATE_MONGO_URI       - MongoDB connection string (never commit credentials)
#   FLUXGATE_REDIS_URI       - Redis endpoints used to publish rule change notifications
#   CORS_ALLOWED_ORIGINS     - explicit list of UI origins, never "*"
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

app:
  security:
    cors:
      # Explicit origins only. A "*" here together with allow-credentials fails startup.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: false

fluxgate:
  studio:
    security:
      audience: ${STUDIO_JWT_AUDIENCE:fluxgate-studio-admin-api}
      # Requires an "audience" protocol mapper on the Keycloak client that adds
      # "fluxgate-studio-admin-api" to the access token "aud" claim. Without that mapper every
      # request is rejected with 401, so add the mapper before rolling this out.
      validate-audience: true
      # The OpenAPI document stays behind ROLE_USER / ROLE_ADMIN.
      public-api-docs: false

  mongo:
    enabled: true
    uri: ${FLUXGATE_MONGO_URI}
    database: ${FLUXGATE_MONGO_DB:fluxgate}
    rule-collection: rate_limit_rules
    # Production must never create collections implicitly: the collection and its indexes are
    # provisioned by the database migration, the application only asserts that they exist.
    ddl-auto: validate

  reload:
    enabled: false

  control:
    redis:
      uri: ${FLUXGATE_REDIS_URI}
      channel: ${FLUXGATE_RELOAD_CHANNEL:fluxgate:rule-reload}
      timeout: 5s
    source: fluxgate-studio-admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.fluxgate: INFO
    org.springframework.web: WARN

springdoc:
  # Keep the interactive Swagger UI off in production. The OpenAPI document itself stays available to
  # API clients, but only to authenticated ones: public-api-docs above is false, so /api-docs/**
  # requires ROLE_USER or ROLE_ADMIN (see SecurityConfig#apiDocsAuthorization).
  swagger-ui:
    enabled: false
